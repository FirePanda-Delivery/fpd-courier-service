# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "develop", "DIP-6" ]
  pull_request:
    branches: [ "develop" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: 17
          distribution: 'adopt'

      - name: Build with Gradle
        run: ./gradlew build

      - run: ls -la

  prepare-environment:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Stop and remove container
        run: docker stop courier-service || true
      - name: Remove unused data
        run: docker rm courier-service || true && docker rmi courier-service || true

  deploy:
    runs-on: self-hosted
    needs: prepare-environment
    steps:
      - name: checkout repo
        uses: actions/checkout@v2
      - name: docker build
        run: docker build ./ -t courier-service
      - name: run image
        run: docker run -p 8080:8082 --name courier-service courier-service
